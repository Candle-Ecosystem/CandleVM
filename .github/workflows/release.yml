name: CandleVM Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            binary: candlevm

          - target: macos-aarch64
            runner: macos-15
            binary: candlevm

          - target: linux-x86_64-glibc
            runner: ubuntu-24.04
            binary: candlevm

          - target: linux-aarch64-glibc
            runner: ubuntu-24.04-arm
            binary: candlevm

          - target: windows-x86_64
            runner: windows-2025
            binary: candlevm.exe

          - target: windows-aarch64
            runner: windows-11-arm
            binary: candlevm.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build CandleVM
        run: cargo build --release --locked

      - name: Package ZIP
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
          TARGET_NAME: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          binary = root / "target" / "release" / os.environ["BINARY_NAME"]
          dist = root / "dist"
          dist.mkdir(exist_ok=True)

          if not binary.is_file():
              raise SystemExit(f"Build output not found: {binary}")

          archive = dist / (
              f"candlevm-{os.environ['VERSION']}-"
              f"{os.environ['TARGET_NAME']}.zip"
          )

          files = [binary, root / "LICENSE", root / "README.md"]

          with zipfile.ZipFile(
              archive, "w", compression=zipfile.ZIP_DEFLATED
          ) as zf:
              for file in files:
                  if file.is_file():
                      zf.write(file, file.name)

          print(f"Created {archive}")
          PY

      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: candlevm-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: candlevm-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
