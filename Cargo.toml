[package]
name = "candlevm"
version = "1.0.1"
edition = "2024"
description = "Candle Virtual Machine"
readme = "README.md"
license = "GPL-3.0-only"
documentation = "https://candle.nozyx.dev/docs/1/candlevm/plugins"
homepage = "https://candle.nozyx.dev"
repository = "https://github.com/candle-ecosystem/candlevm"
exclude = [
    ".github/**",
    ".gitignore",
]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
libloading = "0.9.0"
ctrlc = "3.5.2"

[[bin]]
name = "candlevm"
path = "src/main.rs"
required-features = ["cli"]
